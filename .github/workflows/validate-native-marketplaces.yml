name: Validate native marketplaces

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generator syntax
        run: python3 -m py_compile scripts/sync-native-manifests.py
      - name: Check generated catalogs
        run: python3 scripts/sync-native-manifests.py --check
